name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/jiractrl .
          tar -C dist -czf "jiractrl_${GOOS}_${GOARCH}.tar.gz" jiractrl
          shasum -a 256 "jiractrl_${GOOS}_${GOARCH}.tar.gz" > "jiractrl_${GOOS}_${GOARCH}.tar.gz.sha256"
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jiractrl_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            jiractrl_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
