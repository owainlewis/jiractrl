name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release assets
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}"
            export GOARCH="${target#*/}"
            archive="jiractrl_${GOOS}_${GOARCH}.tar.gz"
            go build -trimpath -ldflags="-s -w" -o dist/jiractrl .
            tar -C dist -czf "$archive" jiractrl
            sha256sum "$archive" > "$archive.sha256"
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jiractrl_*.tar.gz
            jiractrl_*.tar.gz.sha256
            install.sh
