[jira]
base_url = "https://jira.example.com"
token = "your-personal-access-token"
# Detect Jira Cloud or Data Center from serverInfo. Set this explicitly when
# that endpoint is blocked: "cloud" or "data_center".
deployment = "auto"
# For Jira Cloud, set email and use a Cloud API token as the token above.
# email = "you@example.com"

[defaults]
max_results = 50
output = "text"

[retry]
# Safe reads only. Mutations are always sent exactly once.
max_attempts = 3
base_delay_ms = 500
max_delay_ms = 30000

[profiles.my_open]
jql = "assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC"
fields = ["summary", "status", "assignee", "priority", "issuetype", "created", "updated"]
max_results = 50

[profiles.project_recent]
jql = "project = MYPROJ AND updated >= -7d ORDER BY updated DESC"
max_results = 100
